async function inspect(f){let d=null;try{d=await getDoc(f,false);const p=await d.getPage(1),sc=260/p.getViewport({scale:1}).width,v=p.getViewport({scale:sc}),c=document.createElement('canvas');c.width=Math.floor(v.width);c.height=Math.floor(v.height);

 if(pdf){try{pdf.destroy()}catch(_){}pdf=null}pages.innerHTML='';io&&io.disconnect();tfor=null;pn();curId=null;$('#ld').style.display='none';$('#reader').classList.remove('nbm','vdm','mmm');mm=false;pgc.clear();$('#reader').style.display='none';$('#lib').style.display='block';renderLib()}

function renderLib(){if(libTab==='nb'){renderNb();return}if(libTab==='pl'){renderPl();return}if(libTab==='vd'){renderVd();return}const q=query.trim().toLowerCase();

/* ---- formas geométricas ---- */
let shp='rect';
const SHAPES=[['line','Linha','<path d="M4 20L20 4"/>'],['arrow','Seta','<path d="M4 20L20 4M11 4h9v9"/>'],['rect','Retângulo','<rect x="3.5" y="6" width="17" height="12" rx="1"/>'],['ellipse','Elipse','<ellipse cx="12" cy="12" rx="9" ry="6.5"/>'],['tri','Triângulo','<path d="M12 4l9 16H3z"/>'],['diamond','Losango','<path d="M12 3l9 9-9 9-9-9z"/>'],['hex','Hexágono','<path d="M7 4h10l5 8-5 8H7l-5-8z"/>'],['star','Estrela','<path d="M12 3l2.7 5.8 6.3.8-4.6 4.4 1.2 6.3L12 17.3l-5.6 3 1.2-6.3L3 9.6l6.3-.8z"/>']];
function shapePts(it){const x0=it.x0*W,y0=it.y0,x1=it.x1*W,y1=it.y1,cx=(x0+x1)/2,cy=(y0+y1)/2,rx=(x1-x0)/2,ry=(y1-y0)/2,t=it.t;
 if(t==='arrow'){const a=Math.atan2(y1-y0,x1-x0),L=Math.min(42,Math.hypot(x1-x0,y1-y0)*.35),r=.5;return[[x0,y0],[x1,y1],[x1-L*Math.cos(a-r),y1-L*Math.sin(a-r)],[x1,y1],[x1-L*Math.cos(a+r),y1-L*Math.sin(a+r)]]}
 if(t==='rect')return[[x0,y0],[x1,y0],[x1,y1],[x0,y1],[x0,y0]];
 if(t==='ellipse'){const p=[];for(let i=0;i<=48;i++){const a=i/48*Math.PI*2;p.push([cx+rx*Math.cos(a),cy+ry*Math.sin(a)])}return p}
 if(t==='tri')return[[cx,y0],[x1,y1],[x0,y1],[cx,y0]];
 if(t==='diamond')return[[cx,y0],[x1,cy],[cx,y1],[x0,cy],[cx,y0]];
 if(t==='hex')return[[x0+rx*.5,y0],[x1-rx*.5,y0],[x1,cy],[x1-rx*.5,y1],[x0+rx*.5,y1],[x0,cy],[x0+rx*.5,y0]];
 if(t==='star'){const p=[];for(let i=0;i<=10;i++){const a=-Math.PI/2+i*Math.PI/5,m=i%2?.45:1;p.push([cx+rx*m*Math.cos(a),cy+ry*m*Math.sin(a)])}return p}
 return[[x0,y0],[x1,y1]]}
function shapeHit(t,x,y){const p=shapePts(t),px=x*W,r=ers+t.s/2;for(let i=0;i<p.length-1;i++){const[a,b]=p[i],[c,d]=p[i+1],dx=c-a,dy=d-b,l=dx*dx+dy*dy;let u=l?((px-a)*dx+(y-b)*dy)/l:0;u=Math.max(0,Math.min(1,u));if(Math.hypot(px-(a+u*dx),y-(b+u*dy))<r)return true}return false}

shpE.innerHTML=SHAPES.map(([k,t,d])=>'<button data-sh="'+k+'" title="'+t+'"'+(k===shp?' class="on"':'')+'><svg class="ic" viewBox="0 0 24 24">'+d+'</svg></button>').join('');

/* ---- PDF com margens: páginas desenhadas dentro do caderno ---- */
const pgc=new Map();let pgp=Promise.resolve();const pgq=new Set();
function qpage(n){const tw=Math.min(1600,Math.round(PW*z*Math.min(nd,1.5))),e=pgc.get(n);if(e&&e.tw>=tw*.7&&e.tw<=tw*2.2)return;if(pgq.has(n))return;pgq.add(n);
 pgp=pgp.then(async()=>{try{if(!mm||!pdf)return;const p=await pdf.getPage(n),v0=p.getViewport({scale:1}),v=p.getViewport({scale:tw/v0.width}),c=document.createElement('canvas');c.width=Math.floor(v.width);c.height=Math.floor(v.height);
  await p.render({canvasContext:c.getContext('2d'),viewport:v}).promise;pgc.set(n,{c,tw});p.cleanup();for(const k of [...pgc.keys()])if(Math.abs(k-cp)>5)pgc.delete(k);needDraw()}catch(_){}finally{pgq.delete(n)}})}
function drawPages(){const sl=np.scrollTop/z,eh=sl+cv.clientHeight/z,n0=Math.max(1,Math.floor((sl-GAP)/(PH+GAP))+1),n1=Math.min(pdf.numPages,Math.floor((eh-GAP)/(PH+GAP))+1);
 for(let n=n0;n<=n1;n++){const y=GAP+(n-1)*(PH+GAP),e=pgc.get(n);ctx.fillStyle='rgba(0,0,0,.2)';ctx.fillRect(PX+2,y+3,PW,PH);ctx.fillStyle='#fff';ctx.fillRect(PX,y,PW,PH);if(e)ctx.drawImage(e.c,PX,y,PW,PH);qpage(n)}if(n0>1)qpage(n0-1);if(n1<pdf.numPages)qpage(n1+1)}
np.addEventListener('scroll',()=>{if(!mm||!pdf)return;const n=Math.max(1,Math.min(pdf.numPages,Math.floor((np.scrollTop/z+np.clientHeight/z/2-GAP/2)/(PH+GAP))+1));if(n!==cp){cp=n;pn();progress()}},{passive:true});

function chooseMode(){return new Promise(res=>{dlg.innerHTML='<div class="dc modec"><h3>Como você quer estudar este PDF?</h3><div class="mopts"><button class="mopt" data-m="margin">'+SVGM+'<b>PDF com margens</b><small>O PDF no centro e margens dos lados para anotar. Também dá para escrever por cima do PDF.</small></button><button class="mopt" data-m="split">'+SVGS+'<b>PDF com notas</b><small>O PDF de um lado e as notas do outro, separados por uma divisória.</small></button></div><label class="rem"><input type="checkbox" id="remc"> Salvar minha escolha para este PDF</label><div class="dbs"><button data-i="x">Cancelar</button></div></div>';

/* sessão de estudo */
let ss=null,wl=null;
try{ss=JSON.parse(localStorage.getItem('ls-sess')||'null')}catch(_){}
const saveS=()=>{try{ss?localStorage.setItem('ls-sess',JSON.stringify(ss)):localStorage.removeItem('ls-sess')}catch(_){}};
const left=()=>ss?(ss.rem!=null?ss.rem:Math.max(0,ss.end-Date.now())):0;
const fm=ms=>{const t=Math.ceil(ms/1000),h=Math.floor(t/3600),m=Math.floor(t%3600/60),r=t%60,p=n=>String(n).padStart(2,'0');return h?h+':'+p(m)+':'+p(r):p(m)+':'+p(r)};
function tick(){const tm=$('#tm');
 if(!ss){tm.style.display='none';tm.classList.remove('open','done');document.body.classList.remove('foco');$('#sst').textContent='Sessão de estudo';return}
 const l=left();tm.style.display='flex';document.body.classList.add('foco');
 $('#tmt').textContent=fm(l);tm.style.setProperty('--p',Math.max(0,Math.min(100,100-l/ss.dur*100)));

 $('#sst').textContent=ss.rem!=null?'Sessão pausada':'Sessão: '+fm(l);
 if(l<=0&&!ss.fin){ss.fin=true;saveS();finish()}}
setInterval(tick,500);
async function focusOn(){try{const d=document.documentElement;if(d.requestFullscreen&&!document.fullscreenElement)await d.requestFullscreen()}catch(_){}
